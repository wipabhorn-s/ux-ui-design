<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คอร์สของฉัน | LearnHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'brand':'#CA895F','charcoal':'#595758'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background:var(--color-gray-50);">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR (same as student-dashboard) -->
<aside class="sidebar" id="dashSidebar">
  <div class="sidebar-logo">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#CA895F"/><path d="M8 10h12M8 14h10M8 18h8M8 22h6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    LearnHub
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-title">เมนูหลัก</div>
    <a href="student-dashboard.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="my-courses.html" class="sidebar-link active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      คอร์สของฉัน <span class="sidebar-badge">12</span>
    </a>
    <a href="certificate.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
      ใบประกาศนียบัตร
    </a>
    <a href="profile.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      ตั้งค่าบัญชี
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-user-avatar"><img src="https://ui-avatars.com/api/?name=Somsak+R&background=CA895F&color=fff&size=72" alt=""></div>
      <div><div class="sidebar-user-name">สมศักดิ์ รักเรียน</div><div class="sidebar-user-role">ผู้เรียน</div></div>
    </div>
  </div>
</aside>

<div class="dashboard-layout">
  <header class="dash-header">
    <div class="dash-header-left">
      <button class="navbar-icon-btn dash-mobile-toggle" id="sidebarToggle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="dash-breadcrumb"><a href="student-dashboard.html">Dashboard</a><span>›</span><span>คอร์สของฉัน</span></div>
    </div>
    <div class="dash-header-right">
      <a href="courses.html" class="btn btn-primary btn-sm">+ เพิ่มคอร์สใหม่</a>
      <img src="https://ui-avatars.com/api/?name=Somsak+R&background=CA895F&color=fff&size=72" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--color-border);" alt="">
    </div>
  </header>

  <main class="dash-content">
    <!-- Title -->
    <div style="margin-bottom:1.75rem;">
      <h1 class="dash-page-title">📚 คอร์สของฉัน</h1>
      <p class="dash-page-subtitle">ลงทะเบียนไว้ 7 คอร์ส • เรียนจบแล้ว 3 คอร์ส</p>
    </div>

    <!-- Filter Tabs + Search -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div style="display:flex;gap:0;border-bottom:2px solid var(--color-border);overflow-x:auto;">
        <button data-course-filter="all" style="padding:0.625rem 1.125rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid var(--color-primary);margin-bottom:-2px;color:var(--color-primary);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;white-space:nowrap;">
          ทั้งหมด (7)
        </button>
        <button data-course-filter="in-progress" style="padding:0.625rem 1.125rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--color-text-muted);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;white-space:nowrap;">
          กำลังเรียน (3)
        </button>
        <button data-course-filter="completed" style="padding:0.625rem 1.125rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--color-text-muted);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;white-space:nowrap;">
          เรียนจบแล้ว (3)
        </button>
        <button data-course-filter="not-started" style="padding:0.625rem 1.125rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--color-text-muted);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;white-space:nowrap;">
          ยังไม่เริ่ม (1)
        </button>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <select class="form-select" style="width:auto;font-size:0.875rem;">
          <option>จัดเรียงตาม: ล่าสุด</option>
          <option>ตามชื่อ A-Z</option>
          <option>ความก้าวหน้า</option>
        </select>
      </div>
    </div>

    <!-- Course Cards Grid -->
    <div class="grid-3" id="myCoursesGrid"></div>

    <!-- Empty State (hidden by default) -->
    <div id="myCoursesEmpty" style="display:none;" class="empty-state">
      <div class="empty-state-icon" style="background:var(--color-gray-100);">📚</div>
      <h3 class="empty-state-title">ไม่มีคอร์สในหมวดนี้</h3>
      <p class="empty-state-text">ลองสำรวจคอร์สที่น่าสนใจแล้วเริ่มเรียนใหม่</p>
      <a href="courses.html" class="btn btn-primary">ค้นหาคอร์ส</a>
    </div>
  </main>
</div>

<script src="js/mock-data.js"></script>
<script src="js/shared.js"></script>
<script src="js/main.js"></script>
<script>
  initSidebar();
  initMyCoursesFilter();

  const statusLabels = { 'in-progress': { badge: 'badge-warning', text: 'กำลังเรียน' }, 'completed': { badge: 'badge-success', text: 'เรียนจบแล้ว' }, 'not-started': { badge: 'badge-gray', text: 'ยังไม่เริ่ม' } };

  const grid = document.getElementById('myCoursesGrid');
  if (grid) {
    grid.innerHTML = MOCK.myCourses.map(c => {
      const sl = statusLabels[c.status];
      return `
      <div class="card" data-course-status="${c.status}" style="padding:0;overflow:hidden;cursor:pointer;" onclick="window.location.href='course-player.html?id=${c.id}'">
        <div style="position:relative;aspect-ratio:16/9;">
          <img src="${c.thumbnail}" alt="${c.title}" style="width:100%;height:100%;object-fit:cover;">
          <div style="position:absolute;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;" class="play-overlay">
            <div style="width:48px;height:48px;background:rgba(202,137,95,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
        </div>
        <div style="padding:1rem;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;margin-bottom:0.5rem;">
            <h3 style="font-size:0.875rem;font-weight:700;line-height:1.4;color:var(--color-text);" class="truncate-2">${c.title}</h3>
            <span class="badge ${sl.badge}" style="flex-shrink:0;">${sl.text}</span>
          </div>
          <p style="font-size:0.8rem;color:var(--color-text-muted);margin-bottom:0.75rem;">${c.instructor}</p>
          ${c.status !== 'not-started' ? `
          <div style="margin-bottom:0.75rem;">
            <div style="display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:0.375rem;">
              <span style="color:var(--color-text-muted);">${c.progress === 100 ? '✅ เรียนจบแล้ว' : 'ความก้าวหน้า'}</span>
              <span style="font-weight:700;color:${c.progress === 100 ? 'var(--color-success)' : 'var(--color-primary)'};">${c.progress}%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill ${c.progress === 100 ? 'success' : ''}" style="width:${c.progress}%;"></div></div>
          </div>` : `<div style="margin-bottom:0.75rem;font-size:0.8rem;color:var(--color-text-muted);">ลงทะเบียน ${c.enrolledDate}</div>`}
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.75rem;color:var(--color-text-muted);">
            <span>เข้าถึงล่าสุด: ${c.lastAccessed}</span>
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:0.875rem;" onclick="event.stopPropagation()">
            ${c.status === 'completed'
              ? `<a href="certificate.html" class="btn btn-mint btn-sm" style="flex:1;background:var(--color-accent-mint-bg);color:#166534;border:1.5px solid var(--color-accent-mint-dark);">🏆 ดู Certificate</a>`
              : `<a href="course-player.html" class="btn btn-primary btn-sm" style="flex:1;">${c.status === 'not-started' ? '▶ เริ่มเรียน' : '▶ เรียนต่อ'}</a>`
            }
            <button onclick="showToast('นำออกจากรายการ','warning')" style="padding:0.4rem 0.75rem;border:1.5px solid var(--color-border);border-radius:var(--radius-md);background:#fff;cursor:pointer;font-size:0.8rem;color:var(--color-text-muted);transition:all 0.15s;" onmouseover="this.style.borderColor='var(--color-danger)';this.style.color='var(--color-danger)'" onmouseout="this.style.borderColor='var(--color-border)';this.style.color='var(--color-text-muted)'">×</button>
          </div>
        </div>
      </div>`;
    }).join('');

    // Hover overlay
    document.querySelectorAll('.play-overlay').forEach(overlay => {
      const card = overlay.closest('.card');
      card.addEventListener('mouseenter', () => overlay.style.opacity = '1');
      card.addEventListener('mouseleave', () => overlay.style.opacity = '0');
    });
  }
</script>
</body>
</html>
